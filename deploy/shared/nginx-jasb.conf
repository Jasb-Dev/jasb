    # ─── jasb.dev ─────────────────────────────────────────────────────────
    # Added for Jasb, which runs on this host outside Docker. TLS ends here;
    # everything is passed to Caddy on the Docker bridge gateway (host port
    # 8090). Kept in the Jasb repo at deploy/shared/nginx-jasb.conf — if this
    # file is ever replaced from the ark source, paste this block back in.
    server {
        listen 80;
        server_name jasb.dev www.jasb.dev app.jasb.dev api.jasb.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name jasb.dev www.jasb.dev app.jasb.dev api.jasb.dev;

        ssl_certificate /etc/nginx/ssl/live/jasb.dev/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/jasb.dev/privkey.pem;

        client_max_body_size 1m;

        location / {
            proxy_pass http://172.18.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            # No X-Forwarded-For / X-Real-IP: Jasb promises not to see
            # visitor IPs, so they are not passed along.
        }
    }
    # ─── /jasb.dev ────────────────────────────────────────────────────────
