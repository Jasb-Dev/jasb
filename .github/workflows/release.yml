name: Release

# Push a tag like v0.1.0 and this builds the desktop app on all three
# platforms plus the Chrome extension, then attaches everything to a GitHub
# release. Each OS builds its own package because better-sqlite3 is a native
# module and has to be compiled for the platform it ships on.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # No install scripts: the only native module, better-sqlite3, ships
      # N-API binaries for every platform inside its package, so nothing needs
      # compiling (and compiling needs toolchains the runners lack).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package
        shell: bash
        run: pnpm --filter @jasb/desktop run dist:${{ matrix.platform }}
        env:
          # Signing turns on by itself once these secrets exist; until then the
          # builds are unsigned. See LAUNCH.md → Desktop.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @jasb/intent-engine build
      - run: pnpm --filter @jasb/extension build
      - run: cd apps/extension/dist && zip -r "$GITHUB_WORKSPACE/jasb-extension-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: jasb-extension-*.zip

  publish:
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
